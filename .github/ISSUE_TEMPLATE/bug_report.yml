name: "🐛 Bug Report"
description: File a bug report to help us improve Roostr
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please ensure you have tested with the latest version of Roostr.
  - type: input
    id: version
    attributes:
      label: Roostr Version
      description: Run `roostr --version` and paste the output here.
      placeholder: "roostr 0.1.0"
    validations:
      required: true
  - type: input
    id: macos_version
    attributes:
      label: macOS Version & Architecture
      description: e.g. macOS 15.1 Sequoia (Apple Silicon M2 / Intel)
      placeholder: "macOS 15.1 (Apple Silicon)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Open Roostr with `roostr`
        2. Press `n` to create a new job
        3. Fill in ...
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Output
      description: Paste any terminal output or relevant log entries from `~/.local/state/roostr/logs/` or `~/Library/Logs/roostr-daemon.log`.
      render: shell
