name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Test & Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Check code formatting (Ruff)
        run: uv run ruff format --check .

      - name: Run linter (Ruff)
        run: uv run ruff check .

      - name: Run tests with coverage (Pytest)
        run: uv run pytest --cov=roostr --cov-report=term-missing

      - name: Verify package build
        run: uv build
